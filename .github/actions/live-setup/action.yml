name: Live session setup
description: >-
  What the Live family needs on a runner, shared by the live and offload jobs: a 64-bit Python of the machine's own
  architecture with the Frida release the tests are written against (CORVUS_FRIDA_PYTHON names it), and on Linux GDB,
  multilib gcc and ptrace_scope 0.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      id: python
      with:
        python-version: '3.13'

    - name: Frida
      shell: bash
      run: |
        "$PYTHON" -m pip install --disable-pip-version-check frida==17.24.3
        "$PYTHON" -c "import frida, platform, struct; print('frida', frida.__version__, platform.machine(), struct.calcsize('P') * 8, 'bit')"
        echo "CORVUS_FRIDA_PYTHON=$PYTHON" >> "$GITHUB_ENV"
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}

    # Snapshots on Linux are written by gcore (GDB), and gcc-multilib builds
    # the linux-x86 programs. Packages download at tens of kB/s from the
    # runner's mirror at times (11 min seen), so the .deb files are cached per
    # runner image, and nothing is installed when both already work.
    - name: Check GDB and multilib gcc (Linux)
      if: runner.os == 'Linux'
      id: tools
      shell: bash
      run: |
        if command -v gdb > /dev/null && echo 'int main(void) { return 0; }' | gcc -m32 -x c - -o /dev/null 2> /dev/null; then
          echo "install=false" >> "$GITHUB_OUTPUT"
        else
          echo "install=true" >> "$GITHUB_OUTPUT"
        fi
        echo "debs=$RUNNER_TEMP/apt-archives" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    # Restored and saved as separate steps, so a job whose tests fail still
    # keeps the packages it downloaded.
    - uses: actions/cache/restore@v6
      if: runner.os == 'Linux' && steps.tools.outputs.install == 'true'
      id: debs
      with:
        path: ${{ steps.tools.outputs.debs }}
        key: apt-live-${{ runner.arch }}-${{ steps.tools.outputs.image }}
        restore-keys: apt-live-${{ runner.arch }}-

    - name: GDB and multilib gcc (Linux)
      if: runner.os == 'Linux' && steps.tools.outputs.install == 'true'
      shell: bash
      env:
        DEBS: ${{ steps.tools.outputs.debs }}
      run: |
        mkdir -p "$DEBS/partial"
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$DEBS" gdb gcc-multilib
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"
        rm -rf "$DEBS/partial" "$DEBS/lock"

    - uses: actions/cache/save@v6
      if: runner.os == 'Linux' && steps.tools.outputs.install == 'true' && steps.debs.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.tools.outputs.debs }}
        key: apt-live-${{ runner.arch }}-${{ steps.tools.outputs.image }}

    # Attaching to a program the session did not start needs ptrace_scope 0
    # (the runner's is 1).
    - name: ptrace scope (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.yama.ptrace_scope=0
