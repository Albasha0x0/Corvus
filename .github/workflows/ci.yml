name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip
  # One package folder for restore and for everything the tests download: they `dotnet publish` hello-world apps
  # (single-file, self-contained + compressed, ReadyToRun) for the runner's own RID, which pulls runtime and crossgen2
  # packs, and they open dnlib / K4os / Roslyn packages from this folder. One cache entry covers all of it.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: SDK version
        id: sdk
        shell: bash
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      # Keyed on the SDK version too: runtime / crossgen2 pack versions follow the SDK, so a new SDK gets a new entry
      # (saved after the job, with the packs the tests downloaded) instead of re-downloading them on every run.
      - name: Cache NuGet packages and runtime packs
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-sdk${{ steps.sdk.outputs.version }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-sdk${{ steps.sdk.outputs.version }}-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Tests that need local data (NDM_* variables) are skipped. Generated C / C++ / Python is compiled or parsed
      # when clang and python are installed.
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --blame-hang-timeout 15m
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The one-line installers, end to end on a fresh machine: package, install, register, check, reinstall, uninstall.
  install:
    name: install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Package
        shell: bash
        run: |
          rid=$(dotnet --info | grep -m1 'RID:' | awk '{print $2}')
          dotnet publish src/NetDecompilerMcp/NetDecompilerMcp.csproj -c Release -r "$rid" --self-contained true -p:Version=9.9.9 -o out
          if [ "$RUNNER_OS" = Windows ]; then pwsh -c 'Compress-Archive -Path out/* -DestinationPath package.zip'
          else tar -czf package.tar.gz -C out .; fi

      - name: Install, check, uninstall (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$HOME\.cursor" | Out-Null
          $env:NDM_ARCHIVE = (Resolve-Path package.zip).Path
          Get-Content install.ps1 -Raw | Invoke-Expression
          $exe = "$env:LOCALAPPDATA\NetDecompilerMcp\current\NetDecompilerMcp.exe"
          $entry = (Get-Content "$HOME\.cursor\mcp.json" -Raw | ConvertFrom-Json).mcpServers.'net-decompiler'
          if ($entry.command -ne $exe) { throw "Cursor entry: $($entry.command)" }
          & $exe status
          if ($LASTEXITCODE -ne 0) { throw 'status failed' }
          Get-Content install.ps1 -Raw | Invoke-Expression
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Uninstall
          Start-Sleep -Seconds 5
          if ((Get-Content "$HOME\.cursor\mcp.json" -Raw) -match 'net-decompiler') { throw 'still registered' }
          if (Test-Path "$env:LOCALAPPDATA\NetDecompilerMcp") { throw 'files left behind' }

      - name: Install, check, uninstall (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          mkdir -p ~/.cursor
          NDM_ARCHIVE="$PWD/package.tar.gz" sh < install.sh
          grep -q "$HOME/.local/share/net-decompiler-mcp/current/NetDecompilerMcp" ~/.cursor/mcp.json
          ~/.local/bin/NetDecompilerMcp status
          NDM_ARCHIVE="$PWD/package.tar.gz" sh < install.sh
          sh -s -- --uninstall < install.sh
          ! grep -q net-decompiler ~/.cursor/mcp.json
          test ! -e ~/.local/share/net-decompiler-mcp
          test ! -e ~/.local/bin/NetDecompilerMcp
