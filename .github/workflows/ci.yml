name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Nightly: the rebuild check alone.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Also rebuild the newest release tag and compare its managed DLLs with the published ones
        type: boolean
        default: false
      live:
        description: Also run the Live test family (Frida sessions) on macOS, Windows ARM64, Linux and Windows
        type: boolean
        default: false

# Read-only by default; a job that needs more says so.
permissions:
  contents: read

# Live runs and each pushed commit get their own group, so a push never cancels a live run or the offload results
# test.ps1 waits for.
concurrency:
  group: ci-${{ github.ref }}${{ inputs.live && '-live' || '' }}${{ github.event_name == 'schedule' && '-schedule' || '' }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip
  # One package folder, one cache entry: restore plus the runtime and crossgen2 packs the tests' publishes download.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Docs-only (docs/**, *.md) since the newest passing ancestor run, not the parent, so a failed code push still
  # gets tested. Any doubt answers no and every job runs.
  classify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - name: Changed files since the newest passing ancestor
        id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          LIVE: ${{ inputs.live }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          answer() { echo "docs-only=$1" >> "$GITHUB_OUTPUT"; echo "$2"; exit 0; }
          [ "$EVENT" = pull_request ] && answer false 'A pull request runs every job.'
          [ "$LIVE" = true ] && answer false 'A live run runs every job.'
          passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&status=success&per_page=50" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .head_sha') \
            || answer false 'The passing runs could not be listed: every job runs.'
          for base in $passed; do
            compare=$(gh api "repos/$REPO/compare/$base...$SHA" --jq '.status, (.files | length), .files[].filename') || continue
            [ "$(sed -n 1p <<< "$compare")" = ahead ] || continue
            count=$(sed -n 2p <<< "$compare")
            [ "$count" -ge 300 ] && answer false "$count files changed since ${base:0:8}: every job runs."
            files=$(tail -n +3 <<< "$compare")
            if grep -qvE '^docs/|\.md$' <<< "$files"; then
              answer false "Code changed since ${base:0:8}, the newest passing ancestor: every job runs."
            fi
            answer true "Only docs changed since ${base:0:8}, the newest passing ancestor: the Linux test job runs alone."
          done
          answer false 'No passing ancestor among the last 50 passing runs: every job runs.'

  test:
    name: test (${{ matrix.os }})
    needs: classify
    # A failed classify leaves the output empty, and every job runs.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.classify.outputs.docs-only == 'true' && '["ubuntu-latest"]' || '["windows-latest", "ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: SDK version
        id: sdk
        shell: bash
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      # Keyed on the SDK version: runtime and crossgen2 pack versions follow it.
      - name: Cache NuGet packages and runtime packs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-sdk${{ steps.sdk.outputs.version }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-sdk${{ steps.sdk.outputs.version }}-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Logs memory and swap every 15 s: shows whether memory pressure stalls searches on the 7 GB macOS runner.
      - name: Memory sampler (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          nohup bash -c 'while true; do echo "$(date +%T) $(memory_pressure | grep -i "free percentage") | swap $(sysctl -n vm.swapusage)"; sleep 15; done' > "$RUNNER_TEMP/memory.log" 2>&1 &

      # Pinned upstream YARA-X builds, checked by SHA-256; without one for the platform the YARA tests skip.
      - name: YARA-X test builds
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'yara-x'
          ./tests/Corvus.Tests/Support/fetch-yara-x.ps1 -Destination $dir
          "CORVUS_TEST_YARA_X=$dir" >> $env:GITHUB_ENV

      # Tests that need local data (CORVUS_* variables) skip.
      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --blame-hang-timeout 15m
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"

      - name: Memory log (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: cat "$RUNNER_TEMP/memory.log" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Heavy test classes of a pushed commit (sweep, ghidra, live), sharded; the local push run joins these results.
  # Linux runs the cross-platform classes as a check.
  offload:
    name: offload (${{ matrix.group }} ${{ matrix.os }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: classify
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.classify.outputs.docs-only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: sweep, os: windows-latest, shard: 0, shards: 2 }
          - { group: sweep, os: windows-latest, shard: 1, shards: 2 }
          - { group: sweep, os: ubuntu-latest, shard: 0, shards: 1, cross: true }
          - { group: ghidra, os: windows-latest, shard: 0, shards: 3 }
          - { group: ghidra, os: windows-latest, shard: 1, shards: 3 }
          - { group: ghidra, os: windows-latest, shard: 2, shards: 3 }
          - { group: live, os: windows-latest, shard: 0, shards: 2 }
          - { group: live, os: windows-latest, shard: 1, shards: 2 }
          - { group: live, os: ubuntu-latest, shard: 0, shards: 1, cross: true }
    runs-on: ${{ matrix.os }}
    # Above test.ps1's 30 min hang limit plus build and setup, so a hung test ends with its dump.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: SDK version
        id: sdk
        shell: bash
        run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages and runtime packs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-sdk${{ steps.sdk.outputs.version }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-sdk${{ steps.sdk.outputs.version }}-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache test tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test-tools
          key: test-tools-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Corvus.Tests/Support/*-assets.json') }}

      - name: Test tools
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'test-tools/yara-x'
          if (-not (Get-ChildItem $dir -File -ErrorAction SilentlyContinue)) { ./tests/Corvus.Tests/Support/fetch-yara-x.ps1 -Destination $dir }
          "CORVUS_TEST_YARA_X=$dir" >> $env:GITHUB_ENV

      # The Ghidra release and the JDK it runs on, pinned in remote-tools-assets.json.
      - name: Ghidra
        if: matrix.group == 'ghidra'
        shell: pwsh
        run: ./tests/Corvus.Tests/Support/fetch-remote-tools.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'test-tools') -Name ghidra, jdk >> $env:GITHUB_ENV

      - uses: ./.github/actions/live-setup
        if: matrix.group == 'live'

      # The x86 programs of the managed session tests run on the 32-bit runtime, in its standard folder.
      - name: x86 .NET 9 runtime (Windows)
        if: matrix.group == 'live' && runner.os == 'Windows'
        shell: pwsh
        run: |
          # dotnet-install.ps1 from a pinned dotnet/install-scripts commit, checked by SHA-256.
          Invoke-WebRequest https://raw.githubusercontent.com/dotnet/install-scripts/4a37a9f9d1a061fc389d6515100336db4e51710e/src/dotnet-install.ps1 -OutFile dotnet-install.ps1
          if ((Get-FileHash dotnet-install.ps1 -Algorithm SHA256).Hash -ne '3bb07bc8025211836c1e4f9d3f6a044e55b1fb6eec518a6c78851d04e210442b') { throw 'dotnet-install.ps1 does not match its pinned SHA-256' }
          ./dotnet-install.ps1 -Channel 9.0 -Runtime dotnet -Architecture x86 -InstallDir "${env:ProgramFiles(x86)}\dotnet" -NoPath
          # setup-dotnet's DOTNET_ROOT names the x64 install, which an x86 apphost reads when DOTNET_ROOT(x86) is unset.
          "DOTNET_ROOT(x86)=${env:ProgramFiles(x86)}\dotnet" >> $env:GITHUB_ENV

      # Temporary files on the workspace drive: writes to C: stalled for over
      # 40 s on a Windows sweep shard (run 40686942699).
      - name: Test
        shell: pwsh
        run: |
          if ($IsWindows) { $env:TEMP = $env:TMP = $env:RUNNER_TEMP }
          ./test.ps1 -RemoteRun -Group ${{ matrix.group }} -Shard ${{ matrix.shard }}/${{ matrix.shards }} -CrossPlatform:$${{ matrix.cross == true }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offload-${{ matrix.group }}-${{ matrix.os }}-${{ matrix.shard }}
          path: TestResults/offload.trx
          if-no-files-found: ignore

  # Installers end to end: package, install, register, check, reinstall, uninstall.
  install:
    name: install script (${{ matrix.os }})
    needs: classify
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.classify.outputs.docs-only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Package
        shell: bash
        run: |
          rid=$(dotnet --info | grep -m1 'RID:' | awk '{print $2}')
          dotnet publish src/Corvus/Corvus.csproj -c Release -r "$rid" --self-contained true -p:Version=9.9.9 -o out
          if [ "$RUNNER_OS" = Windows ]; then pwsh -c 'Compress-Archive -Path out/* -DestinationPath package.zip'; package=package.zip; asset="corvus-$rid.zip"
          else tar -czf package.tar.gz -C out .; package=package.tar.gz; asset="corvus-$rid.tar.gz"; fi
          # Manifests under the release asset name: the real one and one that must be rejected.
          hash=$( (sha256sum "$package" 2>/dev/null || shasum -a 256 "$package") | awk '{ print $1 }')
          echo "$hash  $asset" > SHA256SUMS
          echo "$(printf '%064d' 0)  $asset" > SHA256SUMS.bad

      - name: Install, check, uninstall (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$HOME\.cursor" | Out-Null
          $env:CORVUS_ARCHIVE = (Resolve-Path package.zip).Path
          $env:CORVUS_SHA256SUMS = (Resolve-Path SHA256SUMS.bad).Path
          $rejected = $false
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $rejected = $_.Exception.Message -match 'Checksum mismatch' }
          if (-not $rejected) { throw 'a checksum mismatch was not rejected' }
          $env:CORVUS_SHA256SUMS = (Resolve-Path SHA256SUMS).Path
          # The archive built above carries no attestation: strict mode refuses it.
          $env:CORVUS_REQUIRE_ATTESTATION = '1'
          $rejected = $false
          try { Get-Content install.ps1 -Raw | Invoke-Expression } catch { $rejected = $_.Exception.Message -match 'Provenance' }
          if (-not $rejected) { throw 'an unattested build was installed under CORVUS_REQUIRE_ATTESTATION=1' }
          Remove-Item Env:CORVUS_REQUIRE_ATTESTATION
          $install = [scriptblock]::Create((Get-Content install.ps1 -Raw))
          # A dry run plans and changes nothing.
          $plan = & $install -DryRun -Yes *>&1 | Out-String
          if ($plan -notmatch 'Dry run: nothing was written') { throw "no plan: $plan" }
          if ((Test-Path "$env:LOCALAPPDATA\Corvus\current") -or (Test-Path "$HOME\.cursor\mcp.json")) { throw 'the dry run changed something' }
          # No terminal and no -Yes: new clients are listed, not registered.
          & $install
          if (Test-Path "$HOME\.cursor\mcp.json") { throw 'registered without consent' }
          & $install -Yes -Client cursor
          Remove-Item Env:CORVUS_SHA256SUMS
          $exe = "$env:LOCALAPPDATA\Corvus\current\corvus.exe"
          $entry = (Get-Content "$HOME\.cursor\mcp.json" -Raw | ConvertFrom-Json).mcpServers.'corvus'
          if ($entry.command -ne $exe) { throw "Cursor entry: $($entry.command)" }
          if (($entry.args -join ' ') -notmatch '(^| )--client cursor( |$)') { throw "Cursor entry args: $($entry.args -join ' ')" }
          & $exe status
          if ($LASTEXITCODE -ne 0) { throw 'status failed' }
          Get-Content install.ps1 -Raw | Invoke-Expression
          $root = "$env:LOCALAPPDATA\Corvus"
          New-Item -ItemType Directory -Force "$root\annotations" | Out-Null
          Set-Content "$root\annotations\marker.json" '{}'
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Uninstall
          Start-Sleep -Seconds 5
          if ((Get-Content "$HOME\.cursor\mcp.json" -Raw) -match '"corvus"') { throw 'still registered' }
          if ((Test-Path "$root\versions") -or (Test-Path "$root\current")) { throw 'program files left behind' }
          if (-not (Test-Path "$root\annotations\marker.json")) { throw 'user data was deleted' }
          Get-Content install.ps1 -Raw | Invoke-Expression
          & ([scriptblock]::Create((Get-Content install.ps1 -Raw))) -Uninstall -PurgeData
          Start-Sleep -Seconds 5
          if (Test-Path $root) { throw 'files left behind after -PurgeData' }

      - name: Install, check, uninstall (sh)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          mkdir -p ~/.cursor
          if CORVUS_ARCHIVE="$PWD/package.tar.gz" CORVUS_SHA256SUMS="$PWD/SHA256SUMS.bad" sh < install.sh 2> err.txt; then exit 1; fi
          grep -q 'checksum mismatch' err.txt
          # The archive built above carries no attestation: strict mode refuses it.
          if CORVUS_REQUIRE_ATTESTATION=1 CORVUS_ARCHIVE="$PWD/package.tar.gz" CORVUS_SHA256SUMS="$PWD/SHA256SUMS" sh < install.sh 2> err.txt; then exit 1; fi
          grep -q 'provenance' err.txt
          # A dry run plans and changes nothing.
          CORVUS_ARCHIVE="$PWD/package.tar.gz" CORVUS_SHA256SUMS="$PWD/SHA256SUMS" sh -s -- --dry-run --yes < install.sh > plan.txt
          grep -q 'Dry run: nothing was written' plan.txt
          test ! -e ~/.local/share/Corvus
          test ! -e ~/.cursor/mcp.json
          # No terminal and no --yes: new clients are listed, not registered.
          CORVUS_ARCHIVE="$PWD/package.tar.gz" CORVUS_SHA256SUMS="$PWD/SHA256SUMS" sh < install.sh
          test ! -e ~/.cursor/mcp.json
          CORVUS_ARCHIVE="$PWD/package.tar.gz" CORVUS_SHA256SUMS="$PWD/SHA256SUMS" sh -s -- --yes --client cursor < install.sh
          grep -q "$HOME/.local/share/Corvus/current/corvus" ~/.cursor/mcp.json
          tr -d ' \n\r' < ~/.cursor/mcp.json | grep -q '"--client","cursor"'
          ~/.local/bin/corvus status
          CORVUS_ARCHIVE="$PWD/package.tar.gz" sh < install.sh
          # Data root is .NET's local application data folder; on Linux also the install folder.
          if [ "$RUNNER_OS" = macOS ]; then data="$HOME/Library/Application Support/Corvus"; else data="$HOME/.local/share/Corvus"; fi
          mkdir -p "$data/annotations" && echo '{}' > "$data/annotations/marker.json"
          sh -s -- --uninstall < install.sh
          ! grep -q '"corvus"' ~/.cursor/mcp.json
          test ! -e ~/.local/share/Corvus/versions
          test ! -e ~/.local/share/Corvus/current
          test ! -e ~/.local/bin/corvus
          test -f "$data/annotations/marker.json"
          CORVUS_ARCHIVE="$PWD/package.tar.gz" sh < install.sh
          sh -s -- --uninstall --purge-data < install.sh
          test ! -e ~/.local/share/Corvus
          test ! -e "$data"

  # Nightly and on request (rebuild=true): rebuild the newest release tag and compare its managed DLLs with the published
  # package's. Reports in the run summary; a differing DLL does not fail the job.
  rebuild:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The tag's own global.json picks the SDK it was released with.
      - name: Newest release tag
        id: tag
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git show "$tag:global.json" > "$RUNNER_TEMP/global.json"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ runner.temp }}/global.json
      - name: Rebuild and compare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./tools/compare-rebuild.ps1 -Tag $env:TAG
  # Manual (live=true): the Live family with slow tests on macOS and Windows ARM64; the others are controls.
  live:
    name: live (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.live
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-11-arm, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: ./.github/actions/live-setup

      # macOS snapshots use lldb's process save-core (Xcode command line tools).
      - name: lldb (macOS)
        if: runner.os == 'macOS'
        run: lldb --version

      - name: Build
        run: dotnet build -c Release

      # Every top-level test class under tests/Corvus.Tests/Live, as test.ps1 finds them.
      - name: Test (Live family)
        shell: bash
        env:
          CORVUS_ALL_TESTS: "1"
        run: |
          filter=$(grep -ohE '^public (sealed |abstract |partial )*class [A-Za-z0-9_]+' tests/Corvus.Tests/Live/*.cs | awk '{print "FullyQualifiedName~." $NF}' | sort -u | paste -sd '|' -)
          dotnet test tests/Corvus.Tests --no-build -c Release --filter "$filter" --blame-hang-timeout 15m --logger "trx;LogFileName=live.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
