name: Scorecard

# OpenSSF Scorecard supply-chain checks; results go to code scanning and the public Scorecard API.
on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the analysis job also publishes its result.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      # Publishing to the Scorecard API signs the result with the workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
