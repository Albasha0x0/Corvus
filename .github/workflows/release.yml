name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --blame-hang-timeout 15m

  package:
    needs: test
    strategy:
      matrix:
        include:
          # bundle: release.ps1 -Bundle makes an MCP bundle (.mcpb) of the target's archive for desktop clients.
          - { rid: win-x64, os: windows-latest, smoke: true, bundle: true }
          - { rid: win-arm64, os: windows-latest, smoke: false, bundle: true }
          - { rid: linux-x64, os: ubuntu-latest, smoke: true, bundle: true }
          - { rid: linux-arm64, os: ubuntu-latest, smoke: false, bundle: true }
          - { rid: linux-musl-x64, os: ubuntu-latest, smoke: false, bundle: false }
          - { rid: linux-musl-arm64, os: ubuntu-latest, smoke: false, bundle: false }
          - { rid: osx-x64, os: macos-latest, smoke: false, bundle: true }
          - { rid: osx-arm64, os: macos-latest, smoke: true, bundle: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Self-contained, not single-file: the runtime's assemblies stay on disk, where the decompiler resolves
      # framework references when no .NET is installed. macOS builds are published on macOS so the launcher is signed.
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Corvus/Corvus.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:Version=${GITHUB_REF_NAME#v} -o out

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          exe=out/corvus; [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$("$exe" version | tr -d '\r')" = "${GITHUB_REF_NAME#v}"
          "$exe" status

      # The NuGet .NET tool is framework-dependent and RID-neutral: packed once, attached for a later nuget.org push.
      - name: Pack .NET tool
        if: matrix.rid == 'win-x64'
        shell: bash
        run: dotnet pack src/Corvus/Corvus.csproj -c Release -p:Version=${GITHUB_REF_NAME#v} -o .

      - name: Package (zip)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath corvus-${{ matrix.rid }}.zip
          # Migration only: an install made before the rename updates from the asset under its old name and runs
          # NetDecompilerMcp(.exe) install from it, a copy of corvus that moves the install to Corvus.
          Copy-Item out/corvus.exe out/NetDecompilerMcp.exe
          Compress-Archive -Path out/* -DestinationPath NetDecompilerMcp-${{ matrix.rid }}.zip

      - name: Package (tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          tar -czf corvus-${{ matrix.rid }}.tar.gz -C out .
          # Migration only: as for the zip above.
          cp -p out/corvus out/NetDecompilerMcp
          tar -czf NetDecompilerMcp-${{ matrix.rid }}.tar.gz -C out .

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: |
            corvus-${{ matrix.rid }}.*
            NetDecompilerMcp-${{ matrix.rid }}.*
            CorvusRE.*.nupkg

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
      # MCP bundles (corvus-<rid>.mcpb) for desktop clients, made from the archives above.
      - name: Bundles
        shell: pwsh
        run: ./release.ps1 -Version $env:GITHUB_REF_NAME -Bundle .
      # The installers and `update` refuse a build whose SHA-256 is not listed here.
      - name: Checksums
        run: sha256sum corvus-* NetDecompilerMcp-* CorvusRE.*.nupkg > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            corvus-*
            NetDecompilerMcp-*
            CorvusRE.*.nupkg
            SHA256SUMS
          generate_release_notes: true
