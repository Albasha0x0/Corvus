name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release --blame-hang-timeout 15m

  package:
    needs: test
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, smoke: true }
          - { rid: win-arm64, os: windows-latest, smoke: false }
          - { rid: linux-x64, os: ubuntu-latest, smoke: true }
          - { rid: linux-arm64, os: ubuntu-latest, smoke: false }
          - { rid: linux-musl-x64, os: ubuntu-latest, smoke: false }
          - { rid: linux-musl-arm64, os: ubuntu-latest, smoke: false }
          - { rid: osx-x64, os: macos-latest, smoke: false }
          - { rid: osx-arm64, os: macos-latest, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Self-contained, not single-file: the runtime's assemblies stay on disk, where the decompiler resolves
      # framework references when no .NET is installed. macOS builds are published on macOS so the launcher is signed.
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/NetDecompilerMcp/NetDecompilerMcp.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:Version=${GITHUB_REF_NAME#v} -o out

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          exe=out/NetDecompilerMcp; [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$("$exe" version | tr -d '\r')" = "${GITHUB_REF_NAME#v}"
          "$exe" status

      - name: Package (zip)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: Compress-Archive -Path out/* -DestinationPath NetDecompilerMcp-${{ matrix.rid }}.zip

      - name: Package (tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: tar -czf NetDecompilerMcp-${{ matrix.rid }}.tar.gz -C out .

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: NetDecompilerMcp-${{ matrix.rid }}.*

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: NetDecompilerMcp-*
          generate_release_notes: true
