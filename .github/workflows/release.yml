name: Release

on:
  push:
    tags: ["v*"]
  # Publishes an existing release's package again (nuget.org, MCP Registry) without rebuilding it, from the tag:
  # gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true

# Read-only by default. Jobs that write or sign say so and run in the release environment, which a reviewer approves for
# each v* tag.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    if: github.event_name == 'push'
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --blame-hang-timeout 15m

  # YARA-X C library for runtimes/<rid>/native: upstream's win-x64 build checked by SHA-256, the others built with
  # cargo-c from the pinned commit. musl archives ship without it.
  yara-x:
    needs: test
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest, target: aarch64-pc-windows-msvc }
          - { rid: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { rid: osx-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { rid: osx-arm64, os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TABLE: tests/Corvus.Tests/Support/yara-x-assets.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Upstream build
        if: ${{ !matrix.target }}
        shell: pwsh
        run: tests/Corvus.Tests/Support/fetch-yara-x.ps1 -Destination yarax -Part library
      # Built on Ubuntu 22.04 so the library needs only glibc 2.34.
      - name: Build from source
        if: ${{ matrix.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: |
          set -e
          commit=$(jq -r .commit "$TABLE"); cargoc=$(jq -r .cargoC "$TABLE")
          rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
          cargo install cargo-c --locked --version "$cargoc"
          git init -q yara-x-src && cd yara-x-src
          git fetch -q --depth 1 "$(jq -r .source "../$TABLE")" "$commit" && git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$commit"
          cargo cbuild -p yara-x-capi --profile release-lto --target "$TARGET"
          mkdir -p ../yarax
          for f in yara_x_capi.dll libyara_x_capi.so libyara_x_capi.dylib; do
            [ -f "target/$TARGET/release-lto/$f" ] && cp "target/$TARGET/release-lto/$f" ../yarax/
          done
          ls ../yarax | grep -q yara_x_capi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yara-x-${{ matrix.rid }}
          path: yarax/*yara_x_capi*

  package:
    needs: yara-x
    strategy:
      matrix:
        include:
          # bundle: release.ps1 -Bundle makes an MCP bundle (.mcpb) of the archive.
          - { rid: win-x64, os: windows-latest, smoke: true, bundle: true }
          - { rid: win-arm64, os: windows-latest, smoke: false, bundle: true }
          - { rid: linux-x64, os: ubuntu-latest, smoke: true, bundle: true }
          - { rid: linux-arm64, os: ubuntu-latest, smoke: false, bundle: true }
          - { rid: linux-musl-x64, os: ubuntu-latest, smoke: false, bundle: false }
          - { rid: linux-musl-arm64, os: ubuntu-latest, smoke: false, bundle: false }
          - { rid: osx-x64, os: macos-latest, smoke: false, bundle: true }
          - { rid: osx-arm64, os: macos-latest, smoke: true, bundle: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Not single-file: the decompiler resolves framework references from the runtime's assemblies on disk.
      # macOS builds are published on macOS so the launcher is signed.
      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Corvus/Corvus.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true -p:Version=${GITHUB_REF_NAME#v} -o out

      - name: YARA-X library
        if: ${{ !contains(matrix.rid, 'musl') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yara-x-${{ matrix.rid }}
          path: out/runtimes/${{ matrix.rid }}/native

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          exe=out/corvus; [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$("$exe" version | tr -d '\r')" = "${GITHUB_REF_NAME#v}"
          "$exe" status

      - name: Package (zip)
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          Compress-Archive -Path out/* -DestinationPath corvus-${{ matrix.rid }}.zip

      - name: Package (tar.gz)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          tar -czf corvus-${{ matrix.rid }}.tar.gz -C out .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.rid }}
          path: corvus-${{ matrix.rid }}.*

  # The .NET tool is framework-dependent and RID-neutral: packed once with every platform's YARA-X library.
  pack:
    needs: yara-x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: yara-x-*
          path: yarax
      - name: Pack .NET tool
        run: |
          for d in yarax/yara-x-*; do rid=${d#yarax/yara-x-}; mkdir -p "native/$rid/native" && cp "$d"/* "native/$rid/native/"; done
          dotnet pack src/Corvus/Corvus.csproj -c Release -p:Version=${GITHUB_REF_NAME#v} -p:YaraXRuntimes="$PWD/native" -o .
          unzip -l CorvusRE.*.nupkg | grep runtimes/.*yara_x_capi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tool
          path: CorvusRE.*.nupkg

  release:
    needs: [package, pack]
    runs-on: ubuntu-latest
    environment: release
    # id-token signs attestations (Sigstore); attestations and artifact-metadata store them.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
      # MCP bundles (corvus-<rid>.mcpb) from the archives above.
      - name: Bundles
        shell: pwsh
        run: ./release.ps1 -Version $env:GITHUB_REF_NAME -Bundle .
      # CycloneDX SBOM of the server's package graph, shared by every asset.
      - name: SBOM
        run: |
          dotnet restore src/Corvus/Corvus.csproj
          dotnet tool install CycloneDX --version 6.2.0 --tool-path "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx/dotnet-CycloneDX" src/Corvus/Corvus.csproj -o . -fn corvus-sbom.cdx.json -F Json -sn Corvus -sv "${GITHUB_REF_NAME#v}"
      # The full test pass the release shipped on (release/tests.json), attested.
      - name: Test summary
        run: cp release/tests.json corvus-tests.json
      # README.md and docs/ as HTML linked to this tag's source; an unresolved link fails the step.
      - name: Docs site
        run: |
          dotnet run --project tools/DocsSite -c Release -- . "$RUNNER_TEMP/site" --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          (cd "$RUNNER_TEMP/site" && zip -qr "$GITHUB_WORKSPACE/corvus-docs.zip" .)
      # Every asset the release attaches; a new asset needs only a file name matched here.
      - name: Assets
        run: sha256sum corvus-* CorvusRE.*.nupkg > "$RUNNER_TEMP/assets.sha256"
      # SLSA build provenance for every asset; `gh attestation verify <asset> --repo <owner/name>` checks one.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-checksums: ${{ runner.temp }}/assets.sha256
      # One attestation names every asset, so each <asset>.sigstore.json is a copy of its bundle, for an offline check.
      - name: Attestation bundles
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -e
          while read -r _ asset; do cp "$BUNDLE" "$asset.sigstore.json"; done < "$RUNNER_TEMP/assets.sha256"
      # The installers and `update` refuse a build whose SHA-256 is not listed here; the bundles are listed too.
      - name: Checksums
        run: |
          set -e
          { cat "$RUNNER_TEMP/assets.sha256"; sha256sum *.sigstore.json; } > SHA256SUMS && cat SHA256SUMS
          test "$(grep -c '\.sigstore\.json$' SHA256SUMS)" = "$(wc -l < "$RUNNER_TEMP/assets.sha256")"
      # SHA256SUMS cannot list its own bundle, which ships beside it as SHA256SUMS.sigstore.json.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: manifest
        with:
          subject-path: SHA256SUMS
      - name: Manifest bundle
        run: cp "${{ steps.manifest.outputs.bundle-path }}" SHA256SUMS.sigstore.json
      # The SBOM attested against the packages it describes.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            corvus-win-*.zip
            corvus-*.tar.gz
            corvus-*.mcpb
            CorvusRE.*.nupkg
          sbom-path: corvus-sbom.cdx.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            corvus-*
            CorvusRE.*
            SHA256SUMS*
          generate_release_notes: true

  # Multi-platform container image of the linux-x64 and linux-arm64 archives, pushed to ghcr.io as version and latest.
  # The Dockerfile has no RUN step, so no emulation is needed.
  image:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-linux-*
          merge-multiple: true
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"; version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver-opt image=moby/buildkit:v0.25.1@sha256:79cc6476ab1a3371c9afd8b44e7c55610057c43e18d9b39b68e2b0c2475cc1b6
          for pair in x64:amd64 arm64:arm64; do
            rid="${pair%%:*}"; arch="${pair#*:}"
            mkdir "out-$arch" && tar -xzf "corvus-linux-$rid.tar.gz" -C "out-$arch"
            docker buildx build --platform "linux/$arch" --provenance=false -t "$image:$version-$arch" --push -f Dockerfile "out-$arch"
          done
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" "$image:$version-amd64" "$image:$version-arm64"

  # nuget.org by Trusted Publishing (policy corvus-release, bound to the release environment), then the MCP Registry by
  # GitHub OIDC.
  # The package is the release asset, checked against SHA256SUMS.
  publish:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release environment admits v* tags only, so a republish runs on the tag and takes its server.json.
      - name: Run from the tag
        run: |
          [ "$TAG" = "$GITHUB_REF_NAME" ] && exit 0
          echo "dispatch from the tag: gh workflow run release.yml --ref $TAG -f tag=$TAG" >&2; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Package from the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "CorvusRE.*.nupkg" --pattern SHA256SUMS --dir dist
          cd dist && sha256sum --check --ignore-missing --strict SHA256SUMS
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: Albasha0x0
      - name: nuget.org
        run: dotnet nuget push dist/CorvusRE.*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      # The registry verifies the package on nuget.org, so wait until the version is listed.
      - name: Wait for nuget.org
        run: |
          version="${TAG#v}"
          for i in $(seq 1 90); do
            curl -fsS https://api.nuget.org/v3-flatcontainer/corvusre/index.json | grep -q "\"$version\"" && exit 0
            sleep 20
          done
          echo "CorvusRE $version is not listed on nuget.org after 30 minutes" >&2; exit 1
      - name: MCP Registry
        run: |
          curl -fsSL -o publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o checksums.txt https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/registry_1.8.1_checksums.txt
          grep " mcp-publisher_linux_amd64.tar.gz$" checksums.txt | sed 's/mcp-publisher_linux_amd64.tar.gz$/publisher.tar.gz/' | sha256sum --check --strict
          tar -xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          jq --arg v "${TAG#v}" '.version = $v | .packages[].version = $v' src/Corvus/.mcp/server.json > server.json
          ./mcp-publisher publish
